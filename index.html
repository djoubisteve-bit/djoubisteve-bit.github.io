<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steve Djoubi — Portfolio</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#0f172a;--muted:#5b6475;--accent:#1d4ed8;--accent-soft:#e8efff;--line:#e2e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#131a26;--text:#eef2f9;--muted:#9aa6bb;--accent:#6ea0ff;--accent-soft:#17233d;--line:#232d3f}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#131a26;--text:#eef2f9;--muted:#9aa6bb;--accent:#6ea0ff;--accent-soft:#17233d;--line:#232d3f}
html{scroll-padding-top:80px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font-weight:700;letter-spacing:.3px}
.links{display:flex;gap:22px}
.links a{color:var(--muted);text-decoration:none;font-size:.93rem}
.links a:hover{color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 11px;font:600 .8rem inherit;font-family:inherit;cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
@media(max-width:620px){.links{display:none}}
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:72px 0 48px}
@media(max-width:700px){.hero{grid-template-columns:1fr}.avatar{display:none}}
.eyebrow{color:var(--accent);font-weight:600;font-size:.9rem;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.1;margin:10px 0 8px;letter-spacing:-.5px}
.role{font-size:1.2rem;color:var(--muted);margin:0 0 18px}
.lead{max-width:560px;color:var(--muted);margin:0 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:9px;text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid var(--line);color:var(--text);background:var(--card)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.avatar{width:150px;height:150px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:3rem;font-weight:700;border:1px solid var(--line)}
section{padding:44px 0;border-top:1px solid var(--line)}
h2{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:1.1rem}
.card p{margin:0;color:var(--muted);flex:1}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.card a.link{color:var(--accent);font-weight:600;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:12px}.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 20px;font-weight:600}
.contact{text-align:center}
.contact .card{align-items:center;padding:34px}
.mail{font-size:1.25rem;font-weight:700;color:var(--accent);text-decoration:none;word-break:break-all}
footer{padding:28px 0;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
